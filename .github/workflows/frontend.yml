name: Frontend CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projecthub-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build frontend image
        run: docker build --tag "projecthub-frontend:${GITHUB_SHA}" .

      - name: Test production container
        shell: bash
        run: |
          set -euo pipefail

          container=$(docker run -d \
            -p 127.0.0.1:3000:3000 \
            "projecthub-frontend:${GITHUB_SHA}")

          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          for route in / /login /pengajuan-saya; do
            if ! curl --fail --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 2 \
              --max-time 5 --output /dev/null \
              "http://127.0.0.1:3000${route}"; then
              docker logs "$container"
              exit 1
            fi
          done

      - name: Deploy frontend to BCC VM
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'       
        env:
          SSH_PORT: ${{ vars.VM_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${SSH_PORT:?Set Actions variable VM_SSH_PORT}"
          : "${SSH_PRIVATE_KEY:?Set Actions secret VM_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Set Actions secret VM_SSH_KNOWN_HOSTS}"

          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          ssh_options=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=15
            -i "$ssh_dir/key"
          )

          target="dev@proxy.bccdev.id"
          image="projecthub-frontend:${GITHUB_SHA}"

          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" \
            'mkdir -p "$HOME/projecthub-frontend"'

          scp "${ssh_options[@]}" -P "$SSH_PORT" compose.yaml \
            "$target:projecthub-frontend/compose.yaml"

          docker image save "$image" | gzip -1 | \
            ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" 'docker image load'

          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" \
            "bash -s -- '$image'" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/projecthub-frontend"

          if APP_IMAGE="$1" docker compose up -d \
            --no-build --pull never --wait --wait-timeout 60 frontend; then
            printf 'APP_IMAGE=%s\n' "$1" > .env.tmp
            mv .env.tmp .env
          else
            APP_IMAGE="$1" docker compose logs --tail=80 frontend || true

            if [ -f .env ]; then
              echo "Mengembalikan image terakhir yang berhasil."
              docker compose up -d --no-build --pull never \
                --wait --wait-timeout 60 frontend
            fi

            exit 1
          fi
          REMOTE