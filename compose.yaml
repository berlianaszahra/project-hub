services:
  frontend:
    image: ${APP_IMAGE:-projecthub-frontend:local}
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-https://group1-be.bccdev.id/api/v1}

    ports:
      - "80:3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 10s
